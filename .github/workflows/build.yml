name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (parsers, Xray config builder)
        run: ./gradlew :shared:jvmTest --console=plain
      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: terabit-android-debug
          path: androidApp/build/outputs/apk/debug/*arm64*.apk

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop app image
        run: ./gradlew :desktopApp:createDistributable --console=plain
